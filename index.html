  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #0f172a; color: #f1f5f9; }
    }
    ::selection { background-color: rgba(59, 130, 246, 0.2); }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; }
    .fade-in-up-delayed { opacity: 0; }
    .fade-in-up-delayed.is-visible { animation: fadeInUp 0.6s ease-out forwards; }
    .card-stagger-1 { animation-delay: 0s; }
    .card-stagger-2 { animation-delay: 0.12s; }
    .card-stagger-3 { animation-delay: 0.24s; }

    /* Typewriter cursor */
    .typewriter-cursor {
      display: inline-block;
      width: 3px;
      margin-left: 2px;
      background-color: #3b82f6;
      animation: blink 0.8s step-end infinite;
      vertical-align: text-bottom;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .typewriter-text { opacity: 0; }
    .typewriter-text.started { opacity: 1; }

    .hero-section { will-change: transform, opacity; transition: opacity 0.1s linear, transform 0.1s linear; pointer-events: auto; }
    .hero-section.scrolled-past { pointer-events: none; }

    @media (hover: hover) and (pointer: fine) {
      .card-expandable {
        transition: box-shadow 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                    border-color 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .card-expandable:hover {
        box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
        border-color: #3b82f6;
      }
      @media (prefers-color-scheme: dark) {
        .card-expandable:hover { box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5); }
      }
    }
    @media (hover: hover) and (pointer: fine) {
      .sub-item { transition: padding-left 0.2s ease, color 0.2s ease; }
      .sub-item:hover { padding-left: 0.5rem; color: #3b82f6; }
    }

    .footer-section { opacity: 0; }
    .footer-section.is-visible { animation: fadeInUp 0.6s ease-out forwards; }

    #canvas-nest-container {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: -1;
    }

    /* Card expand/collapse */
    .card-expandable { cursor: default; }
    .card-expand-btn {
      background: none;
      border: none;
      padding: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      color: #94a3b8;
      flex-shrink: 0;
    }
    .card-expand-btn:hover {
      background-color: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
    }
    .card-expand-btn svg { width: 20px; height: 20px; }
    .card-expandable.expanded .card-expand-btn {
      transform: rotate(180deg);
      color: #3b82f6;
    }
    .card-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.25s ease,
                  padding 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      opacity: 0;
      padding-top: 0;
      position: relative;
      z-index: 1;
    }
    .card-expandable.expanded .card-body {
      max-height: 500px;
      opacity: 1;
      padding-top: 0;
    }
    /* First sub-item always visible */
    .card-first-item {
      margin-top: 0.5rem;
    }
    .card-body {
      margin-top: 0.25rem;
    }
    .card-first-item .sub-item,
    .card-body .sub-item {
      display: flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background-color 0.2s ease, padding-left 0.2s ease, color 0.2s ease;
    }
    @media (hover: hover) and (pointer: fine) {
      .card-first-item .sub-item:hover,
      .card-body .sub-item:hover {
        background-color: rgba(59, 130, 246, 0.08);
        padding-left: 14px;
        color: #3b82f6;
      }
    }
    .sub-item-arrow {
      opacity: 0;
      margin-left: auto;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: translateX(-4px);
      color: #3b82f6;
    }
    @media (hover: hover) and (pointer: fine) {
      .card-first-item .sub-item:hover .sub-item-arrow,
      .card-body .sub-item:hover .sub-item-arrow {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>
</head>

  <script>
    (function () {
      'use strict';

      // ── Typewriter effect for hero title ──
      var typewriterEl = document.querySelector('.typewriter-text');
      var subtitleEl = document.querySelector('.subtitle-line');
      if (typewriterEl) {
        var text = typewriterEl.getAttribute('data-text');
        var i = 0;
        var speed = 80; // ms per character
        typewriterEl.classList.add('started');

        function typeNext() {
          if (i < text.length) {
            typewriterEl.textContent += text.charAt(i);
            i++;
            setTimeout(typeNext, speed + Math.random() * 40); // slight randomness for natural feel
          } else {
            // Typing done — fade in subtitle
            if (subtitleEl) {
              subtitleEl.style.opacity = '1';
              subtitleEl.style.transform = 'translateY(0)';
            }
          }
        }
        setTimeout(typeNext, 400); // brief delay before typing starts
      }

      // ── Intersection Observer for staggered card animations ──
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

      document.querySelectorAll('.fade-in-up-delayed').forEach(function (el) { observer.observe(el); });
      var footer = document.querySelector('.footer-section');
      if (footer) observer.observe(footer);

      // ── Multi-layer parallax ──
      var heroTitle = document.querySelector('.hero-title');
      var heroSubtitle = document.querySelector('.hero-subtitle');
      var heroSection = document.querySelector('.hero-section');
      if (heroSection) {
        var ticking = false;
        window.addEventListener('scroll', function () {
          if (!ticking) {
            requestAnimationFrame(function () {
              var y = window.scrollY || window.pageYOffset;
              var progress = Math.min(y / 500, 1);
              // Hero container fades out
              heroSection.style.opacity = 1 - progress * 0.9;
              heroSection.style.filter = 'blur(' + (progress * 3) + 'px)';
              // Disable pointer events when scrolled past
              if (progress > 0.8) {
                heroSection.classList.add('scrolled-past');
              } else {
                heroSection.classList.remove('scrolled-past');
              }
              // Title moves faster (foreground layer)
              if (heroTitle) {
                heroTitle.style.transform = 'translateY(' + (y * 0.5) + 'px) scale(' + (1 - progress * 0.06) + ')';
              }
              // Subtitle moves slower (background layer) — creates depth
              if (heroSubtitle) {
                heroSubtitle.style.transform = 'translateY(' + (y * 0.25) + 'px)';
              }
              ticking = false;
            });
            ticking = true;
          }
        }, { passive: true });
      }
    })();
  </script>
