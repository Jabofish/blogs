  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .dark body, body.dark { background-color: #0a0a0a; color: #e5e5e5; }
    @media (prefers-color-scheme: dark) {
      body { background-color: #0a0a0a; color: #e5e5e5; }
    }
    ::selection { background-color: rgba(59, 130, 246, 0.2); }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes skeletonPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; }
    .fade-in-up-delayed { opacity: 0; }
    .fade-in-up-delayed.is-visible { animation: fadeInUp 0.6s ease-out forwards; }
    .card-stagger-1 { animation-delay: 0s; }
    .card-stagger-2 { animation-delay: 0.12s; }
    .card-stagger-3 { animation-delay: 0.24s; }
    .card-stagger-4 { animation-delay: 0.36s; }

    /* Typewriter cursor */
    .typewriter-cursor {
      display: inline-block;
      width: 3px;
      margin-left: 2px;
      background-color: #3b82f6;
      animation: blink 0.8s step-end infinite;
      vertical-align: text-bottom;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .typewriter-text { opacity: 0; }
    .typewriter-text.started { opacity: 1; }

    .hero-section { will-change: transform, opacity; transition: opacity 0.1s linear, transform 0.1s linear; pointer-events: auto; }
    .hero-section.scrolled-past { pointer-events: none; }

    @media (hover: hover) and (pointer: fine) {
      .card-expandable {
        transition: box-shadow 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                    border-color 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .card-expandable:hover {
        box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
        border-color: #3b82f6;
      }
      .dark .card-expandable:hover { box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6); }
      @media (prefers-color-scheme: dark) {
        .card-expandable:hover { box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6); }
      }
    }

    .footer-section { opacity: 0; }
    .footer-section.is-visible { animation: fadeInUp 0.6s ease-out forwards; }

    #canvas-nest-container {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: -1;
    }

    /* Card expand/collapse */
    .card-expandable { cursor: default; }
    .card-expand-btn {
      background: none; border: none; padding: 6px;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      color: #94a3b8; flex-shrink: 0;
    }
    .card-expand-btn:hover { background-color: rgba(59, 130, 246, 0.1); color: #3b82f6; }
    .card-expand-btn svg { width: 20px; height: 20px; }
    .card-expandable.expanded .card-expand-btn { transform: rotate(180deg); color: #3b82f6; }

    .card-body {
      max-height: 0; overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.25s ease;
      opacity: 0; position: relative; z-index: 1;
    }
    .card-expandable.expanded .card-body { max-height: 500px; opacity: 1; }

    .card-first-item { margin-top: 0.5rem; }
    .card-body { margin-top: 0.25rem; }

    .card-first-item .sub-item,
    .card-body .sub-item {
      display: flex; align-items: center;
      padding: 6px 10px; border-radius: 8px;
      transition: background-color 0.2s ease, padding-left 0.2s ease, color 0.2s ease;
    }
    @media (hover: hover) and (pointer: fine) {
      .card-first-item .sub-item:hover,
      .card-body .sub-item:hover {
        background-color: rgba(59, 130, 246, 0.08);
        padding-left: 14px; color: #3b82f6;
      }
    }
    .sub-item-arrow {
      opacity: 0; margin-left: auto;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: translateX(-4px); color: #3b82f6;
    }
    @media (hover: hover) and (pointer: fine) {
      .card-first-item .sub-item:hover .sub-item-arrow,
      .card-body .sub-item:hover .sub-item-arrow {
        opacity: 1; transform: translateX(0);
      }
    }

    /* Skeleton loading */
    .skeleton-card {
      border-radius: 0.75rem;
      border: 1px solid #e5e7eb;
      background: #fff;
      padding: 1.25rem;
    }
    .dark .skeleton-card { border-color: #262626; background: #171717; }
    @media (prefers-color-scheme: dark) {
      .skeleton-card { border-color: #262626; background: #171717; }
    }
    .skeleton-line {
      height: 1rem;
      border-radius: 0.375rem;
      background: #e5e7eb;
      animation: skeletonPulse 1.8s ease-in-out infinite;
    }
    .dark .skeleton-line { background: #262626; }
    @media (prefers-color-scheme: dark) {
      .skeleton-line { background: #262626; }
    }
    .skeleton-line-sm { height: 0.75rem; width: 60%; }
    .skeleton-line-md { width: 80%; }
    .skeleton-icon {
      width: 2rem; height: 2rem;
      border-radius: 0.5rem;
      background: #e5e7eb;
      animation: skeletonPulse 1.8s ease-in-out infinite;
      flex-shrink: 0;
    }
    .dark .skeleton-icon { background: #262626; }
    @media (prefers-color-scheme: dark) {
      .skeleton-icon { background: #262626; }
    }

    /* Error fallback */
    #cards-error { display: none; }

    /* nav.json fallback links */
    .fallback-link {
      display: block; padding: 0.5rem 0.75rem;
      border-radius: 0.5rem; text-decoration: none;
      color: #475569; transition: background-color 0.2s;
    }
    .dark .fallback-link { color: #a3a3a3; }
    @media (prefers-color-scheme: dark) {
      .fallback-link { color: #a3a3a3; }
    }
    .fallback-link:hover { background-color: rgba(59, 130, 246, 0.08); color: #3b82f6; }
  </style>

  <script>
    (function () {
      'use strict';

      // ── Icon SVGs ──
      var ICONS = {
        book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
        flask: '<path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16.5h10"/>',
        palette: '<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',
        dot: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
        arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
        chevron: '<polyline points="6 9 12 15 18 9"/>',
      };

      function resolveIcon(title) {
        if (title.indexOf('专业课') !== -1 || title.indexOf('笔记') !== -1) return ICONS.book;
        if (title.indexOf('科研') !== -1 || title.indexOf('研究') !== -1) return ICONS.flask;
        return ICONS.palette;
      }

      function iconSvg(paths, size, cls) {
        return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="' + cls + '" aria-hidden="true">' + paths + '</svg>';
      }
      function smallIconSvg(paths) {
        return '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline-block mr-1.5 shrink-0" aria-hidden="true">' + paths + '</svg>';
      }

      // ── DOM refs ──
      var container = document.getElementById('cards-container');
      var skeleton = document.getElementById('cards-skeleton');
      var errorEl = document.getElementById('cards-error');
      var errorLinks = document.getElementById('cards-error-links');

      // ── Render cards from nav.json data ──
      function renderCards(cards) {
        cards.forEach(function (card, idx) {
          var stagger = Math.min(idx + 1, 4);
          var hasChildren = card.children.length > 0;

          var html = '<div class="card-expandable fade-in-up-delayed card-stagger-' + stagger + ' group rounded-xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-5 sm:p-6 lg:p-8">';
          html += '<div class="flex items-center justify-between">';
          html += '<a href="' + card.url + '" class="flex items-center gap-3 no-underline">';
          html += iconSvg(resolveIcon(card.title), 28, 'w-7 h-7 sm:w-8 sm:h-8 lg:w-9 lg:h-9 text-neutral-400 dark:text-neutral-500 shrink-0');
          html += '<h2 class="text-xl font-semibold text-neutral-800 dark:text-neutral-100 hover:text-accent transition-colors duration-200">' + card.title + '</h2>';
          html += '</a>';

          if (hasChildren) {
            html += '<button class="card-expand-btn" aria-label="展开/收起" onclick="this.closest(\'.card-expandable\').classList.toggle(\'expanded\')">';
            html += '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS.chevron + '</svg>';
            html += '</button>';
          }
          html += '</div>';

          if (hasChildren) {
            var first = card.children[0];
            html += '<div class="card-first-item">';
            html += '<a href="' + first.url + '" class="sub-item flex items-center text-sm text-neutral-500 dark:text-neutral-400 no-underline">';
            html += smallIconSvg(ICONS.dot);
            html += first.name;
            html += '<span class="sub-item-arrow ml-auto">' + iconSvg(ICONS.arrow, 14, '') + '</span>';
            html += '</a></div>';

            if (card.children.length > 1) {
              html += '<div class="card-body"><ul class="space-y-1 list-none p-0 m-0">';
              for (var i = 1; i < card.children.length; i++) {
                var child = card.children[i];
                html += '<li><a href="' + child.url + '" class="sub-item flex items-center text-sm text-neutral-500 dark:text-neutral-400 no-underline">';
                html += smallIconSvg(ICONS.dot);
                html += child.name;
                html += '<span class="sub-item-arrow ml-auto">' + iconSvg(ICONS.arrow, 14, '') + '</span>';
                html += '</a></li>';
              }
              html += '</ul></div>';
            }
          }

          html += '</div>';
          container.insertAdjacentHTML('beforeend', html);
        });
      }

      // ── Attach scroll-intersect observers to all cards ──
      function observeCards() {
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

        container.querySelectorAll('.fade-in-up-delayed').forEach(function (el) {
          observer.observe(el);
        });
      }

      // ── Build simple fallback links when nav.json fails ──
      function buildFallbackLinks() {
        // Walk the pre-rendered cards (if any) to extract links
        var existingCards = container.querySelectorAll('.card-expandable');
        if (existingCards.length > 0) {
          // Pre-rendered cards are already visible, just build error links for reference
          var links = [];
          existingCards.forEach(function (card) {
            var h2 = card.querySelector('h2');
            var a = card.querySelector('a');
            if (h2 && a) {
              links.push('<a href="' + a.getAttribute('href') + '" class="fallback-link">' + h2.textContent + '</a>');
            }
          });
          if (links.length > 0) {
            errorLinks.innerHTML = links.join('');
          }
        }
      }

      // ── Hide skeleton, show error ──
      function showError(err) {
        console.error('Failed to load nav.json:', err);
        if (skeleton) skeleton.style.display = 'none';
        if (errorEl) {
          errorEl.style.display = 'block';
          buildFallbackLinks();
        }
      }

      // ── Hide skeleton ──
      function hideSkeleton() {
        if (skeleton) skeleton.style.display = 'none';
      }

      // ── Initialize: check for pre-rendered cards or fetch nav.json ──
      function initCards() {
        var preRendered = container.querySelectorAll('.card-expandable');

        if (preRendered.length > 0) {
          // Pre-rendered cards exist (home_cards.html was included)
          hideSkeleton();
          observeCards();
        } else {
          // No pre-rendered cards — fetch nav.json and render
          fetch('nav.json')
            .then(function (res) {
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return res.json();
            })
            .then(function (navData) {
              hideSkeleton();
              renderCards(navData);
              observeCards();
            })
            .catch(function (err) {
              showError(err);
            });
        }
      }

      initCards();

      // ── Typewriter effect ──
      var typewriterEl = document.querySelector('.typewriter-text');
      var subtitleEl = document.querySelector('.subtitle-line');
      if (typewriterEl) {
        var text = typewriterEl.getAttribute('data-text');
        var i = 0;
        typewriterEl.classList.add('started');
        function typeNext() {
          if (i < text.length) {
            typewriterEl.textContent += text.charAt(i);
            i++;
            setTimeout(typeNext, 80 + Math.random() * 40);
          } else if (subtitleEl) {
            subtitleEl.style.opacity = '1';
            subtitleEl.style.transform = 'translateY(0)';
          }
        }
        setTimeout(typeNext, 400);
      }

      // ── Footer observer ──
      var footer = document.querySelector('.footer-section');
      if (footer) {
        new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) { entry.target.classList.add('is-visible'); }
          });
        }, { threshold: 0.15 }).observe(footer);
      }

      // ── Multi-layer parallax ──
      var heroTitle = document.querySelector('.hero-title');
      var heroSubtitle = document.querySelector('.hero-subtitle');
      var heroSection = document.querySelector('.hero-section');
      if (heroSection) {
        var ticking = false;
        window.addEventListener('scroll', function () {
          if (!ticking) {
            requestAnimationFrame(function () {
              var y = window.scrollY || window.pageYOffset;
              var progress = Math.min(y / 500, 1);
              heroSection.style.opacity = 1 - progress * 0.9;
              heroSection.style.filter = 'blur(' + (progress * 3) + 'px)';
              if (progress > 0.8) heroSection.classList.add('scrolled-past');
              else heroSection.classList.remove('scrolled-past');
              if (heroTitle) heroTitle.style.transform = 'translateY(' + (y * 0.5) + 'px) scale(' + (1 - progress * 0.06) + ')';
              if (heroSubtitle) heroSubtitle.style.transform = 'translateY(' + (y * 0.25) + 'px)';
              ticking = false;
            });
            ticking = true;
          }
        }, { passive: true });
      }

      // ── Sync dark mode with Zensical theme ──
      // Listen for theme changes from Zensical (it dispatches on localStorage)
      window.addEventListener('storage', function (e) {
        if (e.key === '__md-theme') {
          var html = document.documentElement;
          if (e.newValue === 'slate') html.classList.add('dark');
          else html.classList.remove('dark');
        }
      });

      // Also poll for same-tab changes (Zensical updates localStorage in same tab)
      var _lastTheme = localStorage.getItem('__md-theme');
      setInterval(function () {
        var cur = localStorage.getItem('__md-theme');
        if (cur !== _lastTheme) {
          _lastTheme = cur;
          var html = document.documentElement;
          if (cur === 'slate') html.classList.add('dark');
          else html.classList.remove('dark');
        }
      }, 500);
    })();
  </script>
